name: recipe_book
description: "My Recipe Book — Akıllı Tarif Defteri"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.6.9
  firebase_storage: ^12.4.6

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  lucide_icons_flutter: ^3.1.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

